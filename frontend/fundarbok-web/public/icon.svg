<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="256" cy="256" r="246"/>
    </clipPath>

    <filter id="check-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="doc-grad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#8090B8"/>
      <stop offset="100%" stop-color="#5060A0"/>
    </radialGradient>

    <linearGradient id="bind-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5868B0"/>
      <stop offset="100%" stop-color="#404898"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="#0D0D10"/>

  <g clip-path="url(#circle-clip)">

    <!-- ── Document / Minutes book ── -->
    <!-- Main body -->
    <rect x="136" y="72" width="248" height="344" rx="10"
          fill="url(#doc-grad)" stroke="#3A4888" stroke-width="2"/>

    <!-- Binding strip on left -->
    <rect x="136" y="72" width="28" height="344" rx="6"
          fill="url(#bind-grad)"/>

    <!-- Binding holes -->
    <circle cx="150" cy="152" r="6" fill="#2A3070"/>
    <circle cx="150" cy="256" r="6" fill="#2A3070"/>
    <circle cx="150" cy="360" r="6" fill="#2A3070"/>

    <!-- Header line (title) -->
    <rect x="182" y="118" width="172" height="10" rx="4" fill="#3A4878" opacity="0.9"/>

    <!-- Content lines -->
    <rect x="182" y="148" width="148" height="7" rx="3" fill="#3A4878" opacity="0.7"/>
    <rect x="182" y="170" width="158" height="7" rx="3" fill="#3A4878" opacity="0.7"/>
    <rect x="182" y="192" width="136" height="7" rx="3" fill="#3A4878" opacity="0.6"/>

    <!-- ── Checkmark — glow layer ── -->
    <path filter="url(#check-glow)"
      d="M 172 280 L 232 348 L 352 196"
      fill="none" stroke="#63D0DF" stroke-width="28"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ── Checkmark — solid layer ── -->
    <path
      d="M 172 280 L 232 348 L 352 196"
      fill="none" stroke="#8ECCD8" stroke-width="22"
      stroke-linecap="round" stroke-linejoin="round"/>

  </g>

  <!-- Outer cyan ring -->
  <circle cx="256" cy="256" r="246" fill="none" stroke="#63D0DF" stroke-width="10"/>
</svg>
