<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fundarbókin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1976d2">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
  <script>
    // One-time fix: clear broken service worker cache
    if ('serviceWorker' in navigator && !window.__swFixed) {
      caches.keys().then(function(names) {
        var hasOld = names.some(function(n) { return n.indexOf('ngsw') !== -1; });
        if (hasOld && !localStorage.getItem('sw-fixed-v1')) {
          localStorage.setItem('sw-fixed-v1', '1');
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
          caches.keys().then(function(ns) {
            ns.forEach(function(n) { caches.delete(n); });
          });
          setTimeout(function() { window.location.reload(); }, 500);
        }
      });
    }
  </script>
</body>
</html>
