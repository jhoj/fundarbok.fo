<h2 mat-dialog-title>
  {{ isEditMode ? ('meetings.editConclusion' | translate) : ('meetings.createConclusion' | translate) }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'meetings.conclusionText' | translate }}</mat-label>
      <textarea
        matInput
        formControlName="text"
        rows="8"
        [placeholder]="'meetings.conclusionPlaceholder' | translate">
      </textarea>
      <mat-error *ngIf="form.get('text')?.hasError('required')">
        {{ 'common.required' | translate }}
      </mat-error>
    </mat-form-field>

    <div class="dialog-hint">
      <mat-icon>info</mat-icon>
      <span>{{ 'meetings.conclusionHint' | translate }}</span>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" type="button">
    {{ 'common.cancel' | translate }}
  </button>
  <button
    mat-raised-button
    color="warn"
    (click)="onSubmit()"
    [disabled]="!form.valid"
    type="button">
    <mat-icon>save</mat-icon>
    {{ 'common.save' | translate }}
  </button>
</mat-dialog-actions>
