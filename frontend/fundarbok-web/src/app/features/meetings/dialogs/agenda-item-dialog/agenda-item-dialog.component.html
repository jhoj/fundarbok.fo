<h2 mat-dialog-title>{{ getDialogTitle() }}</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <!-- Title Field -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'agendaItems.itemTitle' | translate }}</mat-label>
      <input matInput formControlName="title" [placeholder]="('agendaItems.itemTitle' | translate)" required>
      <mat-error *ngIf="form.get('title')?.hasError('required')">
        {{ 'errors.validation.required' | translate }}
      </mat-error>
    </mat-form-field>

    <!-- Description Field -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'agendaItems.description' | translate }}</mat-label>
      <textarea
        matInput
        formControlName="description"
        [placeholder]="('agendaItems.description' | translate)"
        rows="6"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="onCancel()">{{ 'common.actions.cancel' | translate }}</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="!form.valid">
    {{ 'common.actions.save' | translate }}
  </button>
</mat-dialog-actions>
