<div class="sidebar-container">
  <!-- Meeting Description Section -->
  <div class="description-section" *ngIf="meetingDescription">
    <div class="section-header">
      <mat-icon class="section-icon">description</mat-icon>
      <h3>{{ 'common.ui.description' | translate }}</h3>
    </div>
    <p class="description-text">{{ meetingDescription }}</p>
  </div>

  <!-- Agenda Items List -->
  <div class="agenda-items-list">
    <mat-list cdkDropList (cdkDropListDropped)="onDrop($event)" [cdkDropListDisabled]="!canReorder()">
      <mat-list-item
        *ngFor="let item of agendaItems; let i = index"
        cdkDrag
        class="agenda-item"
        [class.selected]="isSelected(item)"
        [class.current]="isCurrentItem(item)"
        (click)="onSelectItem(item)">
        <div class="item-drag" cdkDragHandle *appHasRole="'Secretary'">
          <mat-icon>drag_indicator</mat-icon>
        </div>
        <div class="item-title-col">
          <span class="item-title">{{ item.title }}</span>
          <span class="document-count" *ngIf="getDocumentCount(item) > 0">
            <mat-icon>description</mat-icon> {{ getDocumentCount(item) }}
          </span>
        </div>
        <div class="item-number-col">
          {{ item.number }}
        </div>
      </mat-list-item>
    </mat-list>

    <p *ngIf="agendaItems.length === 0" class="no-items">
      {{ 'agendaItems.noItems' | translate }}
    </p>
  </div>

  <!-- Add Button (Secretary only) -->
  <div class="add-button-container" *appHasRole="'Secretary'">
    <button mat-fab color="accent" (click)="onAddItem()" class="add-button">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>
