<div class="preview-header">
  <h2 mat-dialog-title>{{ document.name }}</h2>
  <div class="header-actions">
    <button mat-icon-button (click)="downloadDocument()" matTooltip="Download">
      <mat-icon>download</mat-icon>
    </button>
    <button mat-icon-button (click)="close()" matTooltip="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>

<mat-dialog-content>
  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner></mat-spinner>
    <p>Loading document...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="error-container">
    <mat-icon color="warn">error</mat-icon>
    <p>{{ error }}</p>
    <button mat-raised-button color="primary" (click)="loadDocument()">Retry</button>
  </div>

  <!-- PDF Preview -->
  <div *ngIf="!isLoading && !error && isPDF()" class="pdf-container">
    <ngx-extended-pdf-viewer
      [src]="pdfSrc!"
      [showToolbar]="true"
      [showSidebarButton]="false"
      [showFindButton]="true"
      [showPagingButtons]="true"
      [showZoomButtons]="true"
      [showPresentationModeButton]="false"
      [showOpenFileButton]="false"
      [showPrintButton]="false"
      [showDownloadButton]="false"
      [showSecondaryToolbarButton]="false"
      [showRotateButton]="false"
      [showHandToolButton]="false"
      [showSpreadButton]="false"
      [showPropertiesButton]="false"
      height="100%">
    </ngx-extended-pdf-viewer>
  </div>

  <!-- Image Preview -->
  <div *ngIf="!isLoading && !error && isImage()" class="image-container">
    <img [src]="blobUrl" [alt]="document.name" class="image-preview">
  </div>

  <!-- Text Preview -->
  <div *ngIf="!isLoading && !error && isText()" class="text-container">
    <pre>{{ textContent }}</pre>
  </div>

  <!-- Other File Types -->
  <div *ngIf="!isLoading && !error && !isPDF() && !isImage() && !isText()" class="unsupported-container">
    <mat-icon>insert_drive_file</mat-icon>
    <p>{{ document.fileName }}</p>
    <p>Preview not available for this file type</p>
    <button mat-raised-button color="primary" (click)="downloadDocument()">
      <mat-icon>download</mat-icon>
      Download
    </button>
  </div>
</mat-dialog-content>
