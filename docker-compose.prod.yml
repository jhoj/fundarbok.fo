# Production Docker Compose for VPS Multi-Instance Deployment
#
# This file is used on the VPS to run multiple customer instances.
# Each customer gets their own copy with different .env configuration.
#
# Usage:
# 1. Copy to /opt/fundarbok/customers/<customer-name>/docker-compose.yml
# 2. Configure .env file with customer-specific settings
# 3. Run: docker-compose -p <customer-name> up -d

services:
  # PostgreSQL Database (per customer)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fundarbok}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_DB: ${DB_NAME:-fundarbok}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fundarbok} -d ${DB_NAME:-fundarbok}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Backend API
  backend:
    image: ${DOCKER_REGISTRY:-ghcr.io/jhoj}/fundarbok.fo-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=${DB_NAME:-fundarbok};Username=${DB_USER:-fundarbok};Password=${DB_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET:?JWT secret required}
      Jwt__Issuer: ${JWT_ISSUER:-Fundarbok.API}
      Jwt__Audience: ${JWT_AUDIENCE:-Fundarbok.Web}
      Jwt__ExpirationHours: ${JWT_EXPIRATION_HOURS:-24}
      FileStorage__UploadPath: /app/uploads
      Vapid__PublicKey: ${VAPID_PUBLIC_KEY:-}
      Vapid__PrivateKey: ${VAPID_PRIVATE_KEY:-}
      CorsOrigins__0: https://${CUSTOMER_DOMAIN}
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - internal

  # Frontend (exposed via nginx reverse proxy on host)
  frontend:
    image: ${DOCKER_REGISTRY:-ghcr.io/jhoj}/fundarbok.fo-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

volumes:
  postgres_data:
  uploads_data:

networks:
  internal:
    driver: bridge
